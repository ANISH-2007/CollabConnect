services:
  - type: web
    name: collabconnect-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5001
      - key: JWT_SECRET
        generateValue: true
      - key: DB_HOST
        fromDatabase:
          name: collabconnect-db
          property: host
      - key: DB_USER
        fromDatabase:
          name: collabconnect-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: collabconnect-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: collabconnect-db
          property: database
      - key: FRONTEND_URL
        value: https://collabconnect.vercel.app

databases:
  - name: collabconnect-db
    databaseName: collabconnect
    user: collabconnect_user
    plan: free